[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "br-sat"
version = "1.0.0"
description = "Research code for five-image BR-SAT inference and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = [
  "br_sat_decision",
  "clinical_review",
  "multimodal_model_nvidia",
  "multimodal_data_nvidia",
  "multimodal_cv_model",
  "multimodal_cv_data",
]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
