name: release-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=2,<3"

      - name: Compile source and scripts
        run: python -m compileall -q src scripts

      - name: Test the prespecified decision rule
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Audit public files and reachable Git history
        run: python scripts/audit_release.py --audit-git-history

      - name: Enforce complete frozen release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/audit_release.py --audit-git-history --expect-final
