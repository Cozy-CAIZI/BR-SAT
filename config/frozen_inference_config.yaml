release: v1.0.0
model_version: AIRBPTSAT_V2_CANDIDATE_20260717
input_contract:
  examination_level: true
  required_roles:
    - rbpt
    - sat25
    - sat50
    - sat100
    - sat200
  standard_sat_dilutions:
    - "1:25"
    - "1:50"
    - "1:100"
    - "1:200"
ensemble:
  member_manifest: frozen_ensemble_v1.0.0.json
  expected_member_count: 15
  composition: five_outer_folds_by_three_random_seeds
  per_member_temperature_calibration: true
  probability_aggregation: arithmetic_mean
decision:
  binary_rule: q_R_greater_than_or_equal_to_threshold
  reactive_threshold: 0.572
  threshold_selection_data: development_out_of_fold_predictions
  three_class_traceability_rule: direct_argmax
continuous_score:
  name: q_R
  definition: p_weak_positive_plus_p_positive
  role: primary_binary_decision_and_discrimination_analyses
clinical_boundary:
  intended_use: research_reproducibility_and_expert_governed_second_reader_evaluation
  autonomous_diagnosis: false
